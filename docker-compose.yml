x-reminders-env: &reminders-env
  POSTGRES_HOST: db
  POSTGRES_USER: clinicast
  POSTGRES_PASSWORD: clinicast
  POSTGRES_DB: reminders
  REDIS_URL: redis://redis:6379/0
  SCORING_SERVICE_URL: http://app:8000

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: clinicast
      POSTGRES_PASSWORD: clinicast
      POSTGRES_DB: clinicast
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicast"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://clinicast:clinicast@db:5432/clinicast
      MODEL_PATH: /app/models/noshow_model.joblib
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./models:/app/models

  reminders:
    build: ./reminders
    ports:
      - "3000:3000"
    environment: *reminders-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: bash -c "bundle exec rails db:prepare && bundle exec puma -C config/puma.rb"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  reminders-worker:
    build: ./reminders
    environment: *reminders-env
    depends_on:
      reminders:
        condition: service_healthy
    command: bundle exec sidekiq -C config/sidekiq.yml

volumes:
  pgdata:
